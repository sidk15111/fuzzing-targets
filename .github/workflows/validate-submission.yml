name: Validate submission

# Deliberately just structural/schema validation -- never runs a
# submitter's Dockerfile or build.sh. That step requires a maintainer's
# review first (see the build_bot.yml gate / CODEOWNERS on this repo).
on:
  pull_request:
    paths:
      - "projects/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validation
        run: python3 scripts/validate_submission.py --projects-root projects
