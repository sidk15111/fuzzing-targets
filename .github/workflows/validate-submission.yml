name: Validate submission

# Deliberately just structural/schema validation -- never runs a
# submitter's Dockerfile or build.sh. That step requires a maintainer's
# review first; see fuzzing-infra for that gate.
on:
  pull_request:
    paths:
      - "projects/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fuzzing-targets
        uses: actions/checkout@v4

      - name: Check out validation script from fuzzing-infra
        uses: actions/checkout@v4
        with:
          repository: sidk15111/fuzzing-infra
          path: _fuzzing-infra
          # fuzzing-infra is a separate, narrower-access repo, so the
          # default GITHUB_TOKEN (scoped to this repo only) can't check it
          # out. Needs a repo secret here -- a fine-grained PAT or GitHub
          # App installation token with read-only access to fuzzing-infra.
          token: ${{ secrets.FUZZING_INFRA_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validation
        run: python3 _fuzzing-infra/scripts/validate_submission.py --projects-root projects
