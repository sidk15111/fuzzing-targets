name: Trigger build

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  call-build:
    # TODO: hardcoded to the one project that exists so far. Once a
    # second project is onboarded, this needs to become a step that
    # diffs the merge against its parent to find which project(s)
    # actually changed, rather than a fixed project_path -- see the
    # "affected projects" discussion in the standing plan.
    #
    # Local reusable workflow -- same repo now, so no owner/repo@ref, no
    # Access setting, no visibility or actions-permissions interaction,
    # and no WIF attribute-condition mismatch: this always runs as
    # sidk15111/fuzzing-targets, matching the one condition set on the
    # provider.
    uses: ./.github/workflows/build_bot.yml
    with:
      project_path: projects/mosip/id-repository
      repo_url: https://github.com/sidk15111/fuzzing-targets.git
